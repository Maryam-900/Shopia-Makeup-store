<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Essentials | Shophia Luxury</title>
    <meta name="description" content="Explore the Shophia Essentials collection. Luxury beauty redefined.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        shophia: {
                            bg: '#1A1A1A',
                            plum: '#4A0E2E',
                            rose: '#8E5B6E',
                            silver: '#C0C0C0',
                            white: '#FFFFFF',
                        }
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style type="text/css">
        @layer base {
            body {
                background-color: #1A1A1A;
                color: white;
                font-family: 'Inter', sans-serif;
                -webkit-font-smoothing: antialiased;
                overflow-x: hidden;
            }

            ::-webkit-scrollbar {
                width: 6px;
            }

            ::-webkit-scrollbar-track {
                background: #1A1A1A;
            }

            ::-webkit-scrollbar-thumb {
                background: #4A0E2E;
                border-radius: 10px;
            }
        }

        nav {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-scrolled {
            padding-top: 1rem !important;
            padding-bottom: 1rem !important;
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(192, 192, 192, 0.1);
        }

        #cart-drawer {
            transform: translateX(100%);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #cart-drawer.open {
            transform: translateX(0);
        }

        #cart-overlay {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }

        #cart-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .quick-add {
            transform: translateY(100%);
            transition: transform 0.4s ease;
        }

        .product-group:hover .quick-add {
            transform: translateY(0);
        }

        #feedback-toast {
            transform: translateX(120%);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #feedback-toast.show {
            transform: translateX(0);
        }

        .fade-in-up {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease-out;
        }

        .active-fade {
            opacity: 1;
            transform: translateY(0);
        }

        /* Scroll to Top Arrow - Reimagined Look */
        #scroll-top-btn {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 65px;
            height: 65px;
            background: rgba(74, 14, 46, 0.9);
            backdrop-filter: blur(15px);
            color: white;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateY(40px) rotate(15deg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        #scroll-top-btn.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) rotate(0deg);
        }

        #scroll-top-btn:hover {
            background: white;
            color: #4A0E2E;
            transform: translateY(-8px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            border-color: #4A0E2E;
        }

        #scroll-top-btn svg {
            transition: transform 0.4s ease;
        }

        #scroll-top-btn:hover svg {
            transform: translateY(-3px);
        }
    </style>
</head>

<body class="bg-shophia-bg">

    <!-- Navbar -->
    <nav
        class="fixed top-0 w-full z-50 flex justify-between items-center px-10 py-8 mix-blend-difference border-b border-[#C0C0C0]/10">
        <div class="flex gap-10 text-xs uppercase tracking-[0.25em] font-sans">
            <a href="index.html" class="hover:text-shophia-rose transition-colors relative group">
                Home
            </a>
            <a href="collection.html" class="text-shophia-rose transition-colors relative group font-bold">
                Shop
            </a>
            <a href="index.html#about" class="hover:text-shophia-rose transition-colors relative group">
                About
            </a>
            <a href="collection.html" class="hover:text-shophia-rose transition-colors relative group">
                Collections
            </a>
            <a href="chatbot.html"
                class="text-shophia-gold hover:text-white transition-colors relative group font-bold">
                Our AI
            </a>
        </div>

        <a href="index.html" class="logo-text text-4xl md:text-5xl font-serif italic tracking-tighter">Shophia</a>

        <div class="flex gap-10 text-xs uppercase tracking-[0.2em] items-center">
            <button id="search-btn" class="hover:text-shophia-silver transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </button>
            <a href="wishlist.html" id="wishlist-btn"
                class="hover:text-shophia-silver transition-colors flex items-center gap-2">
                Wishlist (<span id="wish-count">0</span>)
            </a>
            <button id="cart-btn"
                class="text-shophia-plum font-bold hover:text-white transition-colors flex items-center gap-2">
                Cart (<span id="cart-count">0</span>)
            </button>
        </div>
    </nav>

    <!-- Header -->
    <header class="pt-60 pb-32 px-10 text-center">
        <div class="max-w-4xl mx-auto fade-in-up active-fade">
            <h1 class="text-6xl md:text-8xl font-serif italic mb-6">The Essentials</h1>
            <p class="text-shophia-rose uppercase tracking-[0.5em] text-xs">Curated Excellence for Every Skin</p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 pb-40">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-12" id="products-grid">
            <!-- Product Cards -->
            <!-- Products are manually included here for clarity -->
            <script>
                const collectionInventory = [
                    { name: 'Plum Velvet Lipstick', price: 32, img: 'WhatsApp Image 2026-02-14 at 1.40.10 AM.jpeg', desc: 'High-pigment matte finish.' },
                    { name: 'Silver Glow Highlighter', price: 38, img: 'WhatsApp Image 2026-02-14 at 1.40.11 AM.jpeg', desc: 'Metallic micro-pigments.' },
                    { name: 'Lip Balm', price: 18, img: 'Lip balm.jpeg', desc: 'Ultra-hydrating silk finish.' },
                    { name: 'Mascara', price: 28, img: 'mascara.jpeg', desc: 'Volume & length redefined.' },
                    { name: 'Blush', price: 34, img: 'blush.jpeg', desc: 'Seamless radiant flush.' },
                    { name: 'Contour', price: 36, img: 'contour.jpeg', desc: 'Sculpt & define.' },
                    { name: 'Lip Liner', price: 22, img: 'lip liner.jpeg', desc: 'Precision velvet outline.' },
                    { name: 'Lip Tint', price: 26, img: 'lip tint.jpeg', desc: 'Long-wear weightless color.' },
                    { name: 'False Eyelashes', price: 24, img: 'False Eyelashes.jpeg', desc: 'Feather-light luxury lashes.' },
                    { name: 'Beauty Blender', price: 20, img: 'beauty blender.jpeg', desc: 'Precision seamless blending.' },
                    { name: 'Setting Spray', price: 30, img: 'setting spray.jpeg', desc: '24h lock & glow.' },
                    { name: 'Makeup Remover', price: 25, img: 'makeup remover.jpeg', desc: 'Gentle deep purification.' },
                    { name: 'Moisturizer', price: 45, img: 'Moisturizer.jpeg', desc: 'Deep hydration for glowing skin.' },
                    { name: 'Sunblock', price: 35, img: 'sunblock.jpeg', desc: 'Ultimate UV protection.' },
                    { name: 'Concealer', price: 28, img: 'Concealer.jpeg', desc: 'Flawless high-coverage finish.' },
                    { name: 'Lenses', price: 15, img: 'Lenses.jpeg', desc: 'Premium comfort aesthetic lenses.' },
                    { name: 'Makeup brushes', price: 55, img: 'Makeup brushes.jpeg', desc: 'Professional ultra-soft toolset.' },
                    { name: 'Foundation', price: 42, img: 'foundation.jpeg', desc: 'Weightless skin-second radiance.' },
                    { name: 'Eyeshadow palette', price: 65, img: 'Eyeshadow palette.jpeg', desc: 'Curated cinematic pigments.' },
                    { name: 'Nail polish', price: 24, img: 'Nail polish.jpeg', desc: 'High-gloss chip-resistant lacquer.' },
                    { name: 'Serum', price: 75, img: 'Serum.jpeg', desc: 'Youth-restoring elixir.' }
                ];

                document.write(collectionInventory.map((p, idx) => `
                    <div class="product-group group relative fade-in-up" style="transition-delay: ${idx * 50}ms">
                        <div class="bg-[#1A1A1A] border border-white/5 p-4 rounded-sm shadow-2xl overflow-hidden text-left">
                            <div class="relative aspect-[3/4] overflow-hidden bg-[#252525] mb-6">
                                <img src="${p.img}" class="object-cover w-full h-full group-hover:scale-110 transition-transform duration-1000">
                                <button onclick="addToWishlist('${p.name}', ${p.price}, '${p.img}')" 
                                    class="absolute top-4 right-4 z-20 w-10 h-10 rounded-full bg-black/20 backdrop-blur-md flex items-center justify-center text-white/40 hover:text-shophia-rose transition-all hover:scale-110">
                                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                                </button>
                                <div class="absolute inset-x-0 bottom-0 quick-add pointer-events-none group-hover:pointer-events-auto">
                                    <button onclick="addToCart('${p.name}', ${p.price})" class="w-full py-4 bg-shophia-plum text-white uppercase tracking-widest text-xs font-bold hover:bg-white hover:text-shophia-bg transition-all duration-300">Quick Add +</button>
                                </div>
                            </div>
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-serif text-xl">${p.name}</h3>
                                <span class="text-shophia-silver">$${p.price.toFixed(2)}</span>
                            </div>
                            <p class="text-shophia-rose text-xs mb-4">${p.desc}</p>
                        </div>
                    </div>
                `).join(''));
            </script>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-32 bg-[#252525] border-t border-[#C0C0C0]/10 text-center">
        <div class="mb-12">
            <span
                class="font-serif text-7xl md:text-9xl italic text-[#4A0E2E] tracking-tighter opacity-80 inline-block">Shophia</span>
        </div>
        <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})"
            class="mt-16 flex flex-col items-center gap-3 group mx-auto mb-16">
            <div
                class="w-14 h-14 border border-white/10 rounded-full flex items-center justify-center group-hover:bg-shophia-plum group-hover:border-shophia-plum transition-all duration-700 shadow-xl">
                <svg class="w-6 h-6 group-hover:-translate-y-1 transition-transform duration-500" fill="none"
                    stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18">
                    </path>
                </svg>
            </div>
            <span
                class="text-[10px] uppercase tracking-[0.4em] text-white/30 group-hover:text-white transition-colors duration-500">Back
                to top</span>
        </button>
        <p class="text-[#C0C0C0]/30 text-[10px] tracking-[0.5em] uppercase">&copy; 2026 Shophia Luxury.</p>
    </footer>

    <!-- Cart Drawer -->
    <div id="cart-overlay"
        class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[60] opacity-0 pointer-events-none transition-all duration-500">
    </div>
    <div id="cart-drawer"
        class="fixed right-0 top-0 h-full w-full max-w-md bg-shophia-bg border-l border-white/10 z-[70] p-10 flex flex-col">
        <div class="flex justify-between items-center mb-12">
            <h2 class="font-serif text-3xl">Your bag</h2>
            <button id="close-cart"
                class="text-shophia-silver hover:text-white uppercase tracking-widest text-xs font-bold">Close</button>
        </div>
        <div id="cart-items" class="flex-grow overflow-y-auto pr-4"></div>
        <div class="mt-auto pt-10 border-t border-white/10">
            <div class="flex justify-between items-center mb-6">
                <span class="text-shophia-silver uppercase tracking-widest text-xs">Subtotal</span>
                <span id="cart-total" class="font-serif text-2xl">$0.00</span>
            </div>
            <button onclick="window.location.href='checkout.html'"
                class="w-full py-5 bg-shophia-plum text-white uppercase tracking-[0.3em] text-xs font-bold hover:bg-white hover:text-shophia-bg transition-all duration-500">Checkout
                Now</button>
        </div>
    </div>

    <!-- Feedback Toast -->
    <div id="feedback-toast"
        class="fixed bottom-10 right-10 bg-shophia-plum border border-[#C0C0C0]/20 p-6 text-white z-[100] shadow-2xl">
        <p class="font-serif italic text-xl mb-1">Added to your collection.</p>
        <p class="text-white/40 text-[10px] uppercase tracking-widest">Discover your beauty.</p>
    </div>

    <!-- Search Overlay -->
    <div id="search-overlay"
        class="fixed inset-0 bg-shophia-bg/98 backdrop-blur-3xl z-[150] hidden flex-col overflow-y-auto">
        <div
            class="sticky top-0 bg-shophia-bg/80 backdrop-blur-md z-30 pt-10 pb-6 px-6 md:px-10 border-b border-white/5">
            <div class="max-w-7xl mx-auto relative">
                <button id="close-search"
                    class="absolute -top-4 right-0 text-shophia-silver hover:text-white transition-all">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
                <div class="relative group mt-8">
                    <span
                        class="absolute left-0 top-1/2 -translate-y-1/2 text-white/20 group-focus-within:text-shophia-rose transition-colors">
                        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </span>
                    <input type="text" id="search-input" placeholder="Search our collection..."
                        class="w-full bg-transparent border-b-2 border-white/5 pl-16 pr-12 py-8 text-4xl md:text-6xl font-serif text-white focus:outline-none focus:border-shophia-plum transition-all placeholder:text-white/5 uppercase italic">
                    <button id="clear-search"
                        class="absolute right-0 top-1/2 -translate-y-1/2 text-white/20 hover:text-white hidden">
                        <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <div class="max-w-7xl mx-auto w-full px-6 md:px-10 py-12">
            <div id="search-results-info" class="mb-8 hidden">
                <p class="text-[10px] uppercase tracking-widest text-white/30"><span id="search-results-count">0</span>
                    RESULTS FOUND</p>
            </div>
            <div id="search-results" class="grid grid-cols-2 lg:grid-cols-4 gap-8 md:gap-12"></div>
            <div id="search-empty" class="hidden text-center py-20 flex-col items-center">
                <h2 class="text-4xl font-serif italic mb-4">No results found 💕</h2>
                <button onclick="fillSearch('Plum')"
                    class="bg-shophia-plum px-10 py-4 text-[10px] uppercase tracking-widest font-bold hover:bg-white hover:text-shophia-bg transition-all">Shop
                    Popular</button>
            </div>
        </div>
    </div>

    <script>
        // State
        let cart = JSON.parse(localStorage.getItem('shophia_cart')) || [];
        let wishlist = JSON.parse(localStorage.getItem('shophia_wishlist')) || [];

        const inventory = [
            { name: 'Plum Velvet Lipstick', price: 32, img: 'WhatsApp Image 2026-02-14 at 1.40.10 AM.jpeg', category: 'Lips' },
            { name: 'Silver Glow Highlighter', price: 38, img: 'WhatsApp Image 2026-02-14 at 1.40.11 AM.jpeg', category: 'Face' },
            { name: 'Lip Balm', price: 18, img: 'Lip balm.jpeg', category: 'Lips' },
            { name: 'Mascara', price: 28, img: 'mascara.jpeg', category: 'Eyes' },
            { name: 'Blush', price: 34, img: 'blush.jpeg', category: 'Face' },
            { name: 'Contour', price: 36, img: 'contour.jpeg', category: 'Face' },
            { name: 'Lip Liner', price: 22, img: 'lip liner.jpeg', category: 'Lips' },
            { name: 'Lip Tint', price: 26, img: 'lip tint.jpeg', category: 'Lips' },
            { name: 'False Eyelashes', price: 24, img: 'False Eyelashes.jpeg', category: 'Eyes' },
            { name: 'Beauty Blender', price: 20, img: 'beauty blender.jpeg', category: 'Tools' },
            { name: 'Setting Spray', price: 30, img: 'setting spray.jpeg', category: 'Face' },
            { name: 'Makeup Remover', price: 25, img: 'makeup remover.jpeg', category: 'Skincare' },
            { name: 'Moisturizer', price: 45, img: 'Moisturizer.jpeg', category: 'Skincare' },
            { name: 'Sunblock', price: 35, img: 'sunblock.jpeg', category: 'Skincare' },
            { name: 'Concealer', price: 28, img: 'Concealer.jpeg', category: 'Face' },
            { name: 'Lenses', price: 15, img: 'Lenses.jpeg', category: 'Eyes' },
            { name: 'Makeup brushes', price: 55, img: 'Makeup brushes.jpeg', category: 'Tools' },
            { name: 'foundation', price: 42, img: 'foundation.jpeg', category: 'Face' },
            { name: 'Eyeshadow palette', price: 65, img: 'Eyeshadow palette.jpeg', category: 'Eyes' },
            { name: 'Nail polish', price: 24, img: 'Nail polish.jpeg', category: 'Tools' },
            { name: 'Serum', price: 75, img: 'Serum.jpeg', category: 'Skincare' }
        ];

        const cartDrawer = document.getElementById('cart-drawer');
        const cartOverlay = document.getElementById('cart-overlay');
        const cartCount = document.getElementById('cart-count');
        const cartItems = document.getElementById('cart-items');
        const cartTotal = document.getElementById('cart-total');
        const feedbackToast = document.getElementById('feedback-toast');
        const wishCount = document.getElementById('wish-count');
        const searchOverlay = document.getElementById('search-overlay');
        const searchInput = document.getElementById('search-input');
        const searchResultsGrid = document.getElementById('search-results');
        const searchResultsInfo = document.getElementById('search-results-info');
        const searchResultsCount = document.getElementById('search-results-count');
        const searchEmpty = document.getElementById('search-empty');
        const clearSearchBtn = document.getElementById('clear-search');

        function updateCounts() {
            cartCount.innerText = cart.length;
            if (wishCount) wishCount.innerText = wishlist.length;
        }

        window.addToCart = (name, price) => {
            cart.push({ name, price });
            localStorage.setItem('shophia_cart', JSON.stringify(cart));
            updateCounts();
            renderCart();
            showFeedback(`Added ${name} to bag.`);
        };

        window.addToWishlist = (name, price, img) => {
            if (!wishlist.find(i => i.name === name)) {
                wishlist.push({ name, price, img });
                localStorage.setItem('shophia_wishlist', JSON.stringify(wishlist));
                updateCounts();
                showFeedback(`Added ${name} to wishlist.`);
            }
        };

        function renderCart() {
            if (cart.length === 0) {
                cartItems.innerHTML = `
                    <div class="text-center py-20">
                        <p class="text-white/30 italic mb-8">Your bag is currently empty.</p>
                        <a href="collection.html" onclick="closeCart()" class="inline-block text-[10px] uppercase tracking-widest border-b border-white/20 hover:border-white transition-all">Continue Shopping</a>
                    </div>
                `;
                cartTotal.innerText = '$0.00';
                return;
            }
            cartItems.innerHTML = cart.map((item, idx) => `
                <div class="flex justify-between items-center mb-8 pb-4 border-b border-white/5">
                    <div>
                        <p class="font-serif text-lg">${item.name}</p>
                        <p class="text-xs text-shophia-rose">$${item.price.toFixed(2)}</p>
                    </div>
                    <button onclick="removeFromCart(${idx})" class="text-[10px] text-white/30 hover:text-white transition-colors">REMOVE</button>
                </div>
            `).join('');
            const total = cart.reduce((acc, item) => acc + item.price, 0);
            cartTotal.innerText = `$${total.toFixed(2)}`;
        }

        window.removeFromCart = (idx) => {
            cart.splice(idx, 1);
            localStorage.setItem('shophia_cart', JSON.stringify(cart));
            updateCounts();
            renderCart();
        };

        function showFeedback(msg) {
            if (msg) feedbackToast.querySelector('p').innerText = msg;
            feedbackToast.classList.add('show');
            setTimeout(() => feedbackToast.classList.remove('show'), 3000);
        }

        // Search Logic
        document.getElementById('search-btn').addEventListener('click', () => {
            searchOverlay.classList.remove('hidden');
            searchOverlay.classList.add('flex');
            document.body.style.overflow = 'hidden';
            setTimeout(() => searchInput.focus(), 100);
        });

        document.getElementById('close-search').addEventListener('click', () => {
            searchOverlay.classList.add('hidden');
            searchOverlay.classList.remove('flex');
            document.body.style.overflow = 'auto';
        });

        window.fillSearch = (q) => { searchInput.value = q; performSearch(); };

        function performSearch() {
            const query = searchInput.value.toLowerCase().trim();
            if (query.length < 2) {
                searchResultsGrid.innerHTML = '';
                searchResultsInfo.classList.add('hidden');
                return;
            }
            const filtered = inventory.filter(p => p.name.toLowerCase().includes(query) || p.category.toLowerCase().includes(query));
            if (filtered.length === 0) {
                searchResultsGrid.innerHTML = '';
                searchResultsInfo.classList.add('hidden');
                searchEmpty.classList.remove('hidden');
            } else {
                searchEmpty.classList.add('hidden');
                searchResultsInfo.classList.remove('hidden');
                searchResultsCount.innerText = filtered.length;
                searchResultsGrid.innerHTML = filtered.map(p => `
                    <div class="product-group group relative bg-[#1A1A1A] border border-white/5 p-4">
                        <div class="aspect-[3/4] overflow-hidden mb-4"><img src="${p.img}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-1000"></div>
                        <h4 class="font-serif text-sm italic mb-2">${p.name}</h4>
                        <div class="flex justify-between items-center">
                            <span class="text-xs text-shophia-rose">$${p.price.toFixed(2)}</span>
                            <button onclick="addToCart('${p.name}', ${p.price})" class="text-[10px] uppercase tracking-widest hover:text-shophia-plum transition-colors">Add +</button>
                        </div>
                    </div>
                `).join('');
            }
        }

        searchInput.addEventListener('input', () => {
            if (searchInput.value.length > 0) clearSearchBtn.classList.remove('hidden');
            else clearSearchBtn.classList.add('hidden');
            performSearch();
        });

        clearSearchBtn.addEventListener('click', () => { searchInput.value = ''; performSearch(); searchInput.focus(); });

        document.getElementById('cart-btn').addEventListener('click', () => {
            cartDrawer.classList.add('open');
            cartOverlay.classList.add('open');
            renderCart();
        });

        window.closeCart = () => {
            cartDrawer.classList.remove('open');
            cartOverlay.classList.remove('open');
        };

        document.getElementById('close-cart').addEventListener('click', closeCart);
        cartOverlay.addEventListener('click', closeCart);

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('active-fade'); });
        }, { threshold: 0.1 });

        document.querySelectorAll('.fade-in-up').forEach(el => observer.observe(el));
        updateCounts();

        // Scroll to Top Button Visibility
        const scrollTopBtn = document.getElementById('scroll-top-btn');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 500) {
                scrollTopBtn.classList.add('show');
            } else {
                scrollTopBtn.classList.remove('show');
            }
        });
    </script>
    <button id="scroll-top-btn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" aria-label="Scroll to top"
        class="group">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>
        </svg>
        <span class="text-[8px] uppercase tracking-[0.2em] font-bold">Top</span>
    </button>
</body>

</html>
